<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIARI · Diário</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Nunito:wght@400;600;700;800&family=Oswald:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&family=Righteous&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="shortcut icon" type="image/svg+xml" href="svg/Icone.svg">
</head>

<body class="tema-hsm">
    <a class="skip" href="#conteudo">Ir para o conteúdo</a>
    <header id="header">
        <div class="header-inner">
            <a href="index.html" class="logo" aria-label="DIARI, início">
                <img src="svg/Group 48.svg" alt="DIARI">
            </a>
            <nav>
                <ul>
                    <li><a href="index.html" class="menu-item ativo" aria-current="page">Diário</a></li>
                    <li><a href="Tarefa.html" class="menu-item">Tarefas</a></li>
                </ul>
            </nav>
            <span class="tema-chip" aria-hidden="true"></span>
        </div>
    </header>

    <main id="conteudo">
        <section class="hero">
            <h1>Diário</h1>
            <p class="tagline"></p>
        </section>

        <section class="painel" id="diario">
            <h2>Nova página</h2>
            <p class="meta-linha" style="margin-bottom: 0.65rem;">Como foi o dia?</p>
            <div class="humores" id="humores" role="group" aria-label="Humor do dia"></div>
            <label for="diario-text">O que aconteceu hoje</label>
            <textarea id="diario-text" placeholder="Escreva aqui o que aconteceu hoje..."></textarea>
            <div class="meta-linha">
                <span>Ctrl + Enter para salvar</span>
                <span id="contador-chars">0 caracteres</span>
            </div>
            <div class="acoes">
                <button type="button" class="btn" id="btn-salvar" onclick="salvarDiario()">Salvar</button>
                <button type="button" class="btn btn-ghost" onclick="exportarDiario()">Exportar</button>
                <button type="button" class="btn btn-danger" onclick="limparDiarios()">Limpar tudo</button>
            </div>
        </section>

        <div class="toolbar">
            <input type="search" id="busca-diario" placeholder="Buscar nas páginas..." aria-label="Buscar no diário">
            <span class="contador" id="total-entradas">0 páginas</span>
        </div>
        <div id="diario-log"></div>
    </main>

    <div id="personalizacao-tema" class="temas-fixos" role="group" aria-label="Escolher tema">
        <button type="button" class="tema-btn" data-tema="camprock" aria-pressed="false" onclick="mudarTema('camprock')">
            <span aria-hidden="true">🎸</span>
            Camp Rock 3
        </button>
        <button type="button" class="tema-btn" data-tema="hsm" aria-pressed="false" onclick="mudarTema('hsm')">
            <span aria-hidden="true">☀️</span>
            HSM 2
        </button>
        <button type="button" class="tema-btn" data-tema="descendentes" aria-pressed="false" onclick="mudarTema('descendentes')">
            <span aria-hidden="true">♥️</span>
            Descendentes 4
        </button>
        <button type="button" class="tema-btn" data-tema="zombies" aria-pressed="false" onclick="mudarTema('zombies')">
            <span aria-hidden="true">🧛</span>
            Zombies 4
        </button>
    </div>

    <div id="dialogo" class="dialogo" hidden>
        <div class="dialogo-caixa" role="dialog" aria-modal="true" aria-labelledby="dialogo-titulo">
            <h2 id="dialogo-titulo">Confirmar</h2>
            <p id="dialogo-texto"></p>
            <div class="dialogo-acoes">
                <button type="button" class="btn btn-ghost" id="dialogo-cancelar">Cancelar</button>
                <button type="button" class="btn" id="dialogo-confirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 DIARI · Diário e lista de tarefas</p>
    </footer>

    <script src="app.js"></script>
    <script src="diario.js"></script>
</body>

</html>
